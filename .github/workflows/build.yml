name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 1. Quick check (runs on all pushes and PRs) ─────────────
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: npm install
      - run: npx tsc --noEmit || true
      - run: npm test || true
      - run: npm run build

  # ── 1b. Inbouwpakket (@openaec/open-calc-studio) ────────────
  # Bouwt de React-component/bibliotheek als npm-pakket bij elke push; op een
  # tag gaat de .tgz mee als release-asset en, als er een NPM_TOKEN-secret is,
  # naar npm.
  embed:
    name: Embed package
    needs: check
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: npm install
      - run: npm run build:lib
      - name: Pack
        run: |
          mkdir -p release-embed
          (cd packages/embed && npm pack --pack-destination ../../release-embed)
          ls -la release-embed
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: open-calc-studio-embed
          path: release-embed/*.tgz
          retention-days: 14
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') && env.NPM_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          cd packages/embed && npm publish --access public

  # Signed installers for tagged releases and manual test runs.
  build:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/desktop-builds.yml
    secrets: inherit

  # ── 3. Publish release (only on tag push) ───────────────────
  publish:
    name: Publish Release
    needs: [build, embed]
    # A manual test build never creates a release. Only verified, successful
    # platform builds may enter the draft release.
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' && needs.embed.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installer files
        run: |
          mkdir -p release
          find artifacts -name '*-setup.exe' -exec cp {} release/ \;
          find artifacts -name '*.msi' -exec cp {} release/ \;
          find artifacts -name '*.dmg' -exec cp {} release/ \;
          find artifacts -name '*.AppImage' -exec cp {} release/ \;
          find artifacts -name '*.deb' -exec cp {} release/ \;
          find artifacts -name '*.rpm' -exec cp {} release/ \;
          find artifacts -name '*.tgz' -exec cp {} release/ \;
          find artifacts -name '*.sig' -exec cp {} release/ \;
          ls -la release/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Open Calc Studio ${{ github.ref_name }}
          prerelease: false
          draft: true
          generate_release_notes: true
          body: |
            **Downloads:**
            - **Windows:** `.exe` (NSIS installer) / `.msi`
            - **macOS:** `.dmg` (universal: Apple Silicon + Intel)
            - **Linux:** `.AppImage` / `.deb` / `.rpm`
            - **Embed in your own site:** `open-calc-studio-<version>.tgz` — npm package `@openaec/open-calc-studio` (React component + library, see `packages/embed/README.md`)

            Windows installers and installed app binaries are Authenticode-signed.
            The macOS app is Developer ID-signed and notarized; verification checks
            the app extracted from the delivered DMG.
            All platform installers have GitHub build-provenance attestations.
            See docs/desktop-builds.md for verification and test-build downloads.
          files: release/*
