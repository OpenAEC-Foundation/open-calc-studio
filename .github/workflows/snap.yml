name: Build Snap Package

on:
  # Pas als een mens de concept-release van "Build & Release" PUBLICEERT, net als
  # desktop-container.yml en latest-json.yml. Vroeger draaide dit op workflow_run
  # na elke geslaagde tag-build en ging de snap naar `stable` terwijl de
  # GitHub-release nog een concept was. Let op: een release die een workflow met
  # GITHUB_TOKEN publiceert, start deze workflow niet.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Bestaande release-tag om tegen te bouwen (test)'
        required: true
        default: 'v0.10.0'
      publish:
        # Backfill-route: publiceren gebeurt normaal alleen via het
        # release-published-event. Deze snap-pijplijn is echter TOEGEVOEGD NA de
        # huidige release, dus er bestaat geen release-event om aan te haken en
        # de Store zou tot de volgende release blijven hangen op een oude versie.
        # Bewust default false: aanzetten is onomkeerbaar (een Snap-release is
        # niet in te trekken).
        description: 'Ook publiceren naar het stable-kanaal van de Snap Store (ONOMKEERBAAR)'
        type: boolean
        required: false
        default: false

# Minimale default; de build-snap-job zet zelf `contents: write` omdat hij de
# snap als asset aan de release hangt.
permissions:
  contents: read

# Eén globale groep, NIET annuleren: twee releases kort na elkaar publiceren
# allebei naar het `stable`-kanaal van de Snap Store, en een Snap-release is
# niet in te trekken.
concurrency:
  group: snap
  cancel-in-progress: false

jobs:
  build-snap:
    # Ruim boven de snapcraft-bouwtijd, maar begrensd: deze job bevat een
    # poll-lus (max ~2,5 min) plus een snapcraft-build in een VM.
    timeout-minutes: 75
    runs-on: ubuntu-22.04
    # Zelfde gate als desktop-container.yml: geen concept en geen pre-release,
    # en alleen een v*-tag (of een handmatige test).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.release.draft && !github.event.release.prerelease &&
       startsWith(github.event.release.tag_name, 'v'))
    permissions:
      contents: write
    env:
      # Job-level zodat de gated publish-stap er in `if:` naar kan verwijzen.
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

    steps:
      - uses: actions/checkout@v5
        with:
          # snap/snapcraft.yaml moet van de gereleasede tag komen. Voor
          # workflow_dispatch valt dit terug op github.ref (de branch waarop
          # handmatig werd gedispatcht).
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Get version
        id: get-version
        env:
          # Niet-vertrouwde invoer via env, NOOIT rechtstreeks ${} in de shell.
          # GITHUB_*-namen zelf NIET zetten: gereserveerd en al aanwezig in de runner.
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          elif [ "$EVENT_NAME" = "release" ]; then
            VERSION="$RELEASE_TAG"
          else
            VERSION=""
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Kon geen versie afleiden (event=$EVENT_NAME)"
            exit 1
          fi
          # `version` en `version_number` gaan verderop een `sed`-VERVANGINGSPATROON
          # in, en een dispatch-input is vrije tekst — een '/' of '&' herschrijft dat
          # patroon, een nieuwe regel schrijft een tweede regel in $GITHUB_OUTPUT
          # (output-injectie). Whitelist: de `case` dekt de hele waarde (dus ook
          # nieuwe regels), de regex daarna de structuur.
          case "$VERSION" in
            *[!v0-9.]*)
              echo "::error::Versie bevat tekens buiten 'v', cijfers en punten." >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Versie '$VERSION' heeft niet de vorm vX.Y.Z." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_number=${VERSION#v}" >> "$GITHUB_OUTPUT"

      # We bouwen de Tauri-app NIET opnieuw: de snap herverpakt de deb van de
      # gepubliceerde GitHub-release (zelfde artifact als de overige Linux-downloads).
      - name: Wait for release deb and download it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          echo "Wachten op deb-asset van release $VERSION..."
          found=""
          for i in $(seq 1 10); do
            if gh release view "$VERSION" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '_amd64\.deb$'; then
              found=1
              echo "deb-asset gevonden"
              break
            fi
            echo "nog geen deb-asset... (poging $i/10)"
            sleep 15
          done
          if [ -z "$found" ]; then
            echo "::error::deb-asset voor $VERSION verscheen niet op tijd"
            exit 1
          fi
          gh release download "$VERSION" -p '*_amd64.deb' --clobber --dir .
          deb=$(ls *_amd64.deb | head -1)
          cp "$deb" open-calc-studio.deb
          echo "Gebruik $deb -> open-calc-studio.deb"

      - name: Set version in snapcraft.yaml
        env:
          VERSION_NUMBER: ${{ steps.get-version.outputs.version_number }}
        run: |
          sed -i "s/^version: .*/version: '$VERSION_NUMBER'/" snap/snapcraft.yaml
          grep '^version:' snap/snapcraft.yaml

      - name: Build snap
        uses: snapcore/action-build@v1
        id: snapcraft

      # Gepubliceerde release: snap als asset aan de release hangen, met een
      # eigen checksum. SHA256SUMS.txt is al gemaakt vóór de snap bestond (#66);
      # dat bestand achteraf aanvullen kan botsen met latest-json.yml, dat op
      # hetzelfde moment draait. Controle: sha256sum -c <snap>.sha256
      - name: Upload snap to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get-version.outputs.version }}
          SNAP: ${{ steps.snapcraft.outputs.snap }}
        run: |
          name=$(basename "$SNAP")
          (cd "$(dirname "$SNAP")" && sha256sum "$name" > "$name.sha256")
          cat "$SNAP.sha256"
          gh release upload "$VERSION" "$SNAP" "$SNAP.sha256" --clobber

      # Handmatige test: snap als CI-artifact (de release NIET aanraken).
      - name: Upload snap as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: open-calc-studio-snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

      # Ook de handmatige backfill mag alleen een gepubliceerde, niet-pre-release
      # naar `stable` sturen (zelfde controle als latest-json.yml).
      - name: Only a published release goes to stable
        if: >-
          env.SNAPCRAFT_STORE_CREDENTIALS != '' &&
          (github.event_name == 'release' ||
           (github.event_name == 'workflow_dispatch' && inputs.publish))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          state=$(gh release view "$VERSION" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')
          [ "$state" = "false false" ] || { echo "::error::$VERSION is een concept of pre-release"; exit 1; }

      # Live publiceren naar de Snap Store: alleen op een gepubliceerde release
      # én pas zodra het store-credentials-secret bestaat (eigenaar-stap).
      - name: Publish to Snap Store
        if: >-
          env.SNAPCRAFT_STORE_CREDENTIALS != '' &&
          (github.event_name == 'release' ||
           (github.event_name == 'workflow_dispatch' && inputs.publish))
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: stable
