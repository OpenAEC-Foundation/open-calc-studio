name: Build Snap Package

on:
  # Pas als een mens de concept-release van "Build & Release" PUBLICEERT, net als
  # desktop-container.yml en latest-json.yml. Vroeger draaide dit op workflow_run
  # na elke geslaagde tag-build en ging de snap naar `stable` terwijl de
  # GitHub-release nog een concept was. Let op: een release die een workflow met
  # GITHUB_TOKEN publiceert, start deze workflow niet.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Bestaande release-tag om tegen te bouwen (test)'
        required: true
        default: 'v0.10.0'
      publish:
        # Backfill-route: publiceren gebeurt normaal alleen via het
        # release-published-event. Deze snap-pijplijn is echter TOEGEVOEGD NA de
        # huidige release, dus er bestaat geen release-event om aan te haken en
        # de Store zou tot de volgende release blijven hangen op een oude versie.
        # Bewust default false: aanzetten is onomkeerbaar (een Snap-release is
        # niet in te trekken).
        description: 'Ook publiceren naar het stable-kanaal van de Snap Store (ONOMKEERBAAR)'
        type: boolean
        required: false
        default: false
      reuse_release_snap:
        # Herstelroute (#109): de release-run bouwde en hing de snap al aan de
        # release, maar de Store-stap faalde (bijv. verlopen credentials). Dan
        # NIET opnieuw bouwen: een nieuwe build kan andere bytes geven dan het
        # gepubliceerde bestand en de bijbehorende .sha256. Deze route downloadt
        # het bestaande release-bestand, controleert het en publiceert precies
        # die bytes. Zonder `publish` is het een controle-run (droogtest).
        description: 'Bestaande snap van de release gebruiken i.p.v. opnieuw bouwen (herstel na mislukte Store-stap)'
        type: boolean
        required: false
        default: false

# Minimale default; de build-snap-job zet zelf `contents: write` omdat hij de
# snap als asset aan de release hangt.
permissions:
  contents: read

# Eén globale groep, NIET annuleren: twee releases kort na elkaar publiceren
# allebei naar het `stable`-kanaal van de Snap Store, en een Snap-release is
# niet in te trekken.
concurrency:
  group: snap
  cancel-in-progress: false

jobs:
  build-snap:
    # Ruim boven de snapcraft-bouwtijd, maar begrensd: deze job bevat een
    # poll-lus (max ~2,5 min) plus een snapcraft-build in een VM.
    timeout-minutes: 75
    runs-on: ubuntu-22.04
    # Zelfde gate als desktop-container.yml: geen concept en geen pre-release,
    # en alleen een v*-tag (of een handmatige test).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.release.draft && !github.event.release.prerelease &&
       startsWith(github.event.release.tag_name, 'v'))
    permissions:
      contents: write
    env:
      # Job-level zodat de gated publish-stap er in `if:` naar kan verwijzen.
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

    steps:
      - uses: actions/checkout@v5
        with:
          # snap/snapcraft.yaml moet van de gereleasede tag komen. Voor
          # workflow_dispatch valt dit terug op github.ref (de branch waarop
          # handmatig werd gedispatcht).
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Get version
        id: get-version
        env:
          # Niet-vertrouwde invoer via env, NOOIT rechtstreeks ${} in de shell.
          # GITHUB_*-namen zelf NIET zetten: gereserveerd en al aanwezig in de runner.
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          elif [ "$EVENT_NAME" = "release" ]; then
            VERSION="$RELEASE_TAG"
          else
            VERSION=""
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Kon geen versie afleiden (event=$EVENT_NAME)"
            exit 1
          fi
          # `version` en `version_number` gaan verderop een `sed`-VERVANGINGSPATROON
          # in, en een dispatch-input is vrije tekst — een '/' of '&' herschrijft dat
          # patroon, een nieuwe regel schrijft een tweede regel in $GITHUB_OUTPUT
          # (output-injectie). Whitelist: de `case` dekt de hele waarde (dus ook
          # nieuwe regels), de regex daarna de structuur.
          case "$VERSION" in
            *[!v0-9.]*)
              echo "::error::Versie bevat tekens buiten 'v', cijfers en punten." >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Versie '$VERSION' heeft niet de vorm vX.Y.Z." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_number=${VERSION#v}" >> "$GITHUB_OUTPUT"

      # Een gepubliceerde snap + .sha256 op de release zijn onveranderlijk (#109).
      # Een herhaalde release-run (re-run) zou opnieuw bouwen en het bestaande
      # bestand willen vervangen; stop daarom vóór de build met een verwijzing
      # naar de herstelroute.
      - name: Refuse to rebuild over an existing release snap
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          existing=$(gh release view "$VERSION" --json assets \
            --jq '[.assets[].name | select(endswith(".snap") or endswith(".snap.sha256"))] | join(" ")')
          if [ -n "$existing" ]; then
            echo "::error::Release $VERSION heeft al een snap ($existing). Niet opnieuw bouwen of overschrijven. Herstel: start 'Build Snap Package' handmatig met version=$VERSION en reuse_release_snap aan (eerst zonder publish als controle, daarna met publish). Zie docs/desktop-builds.md."
            exit 1
          fi

      # We bouwen de Tauri-app NIET opnieuw: de snap herverpakt de deb van de
      # gepubliceerde GitHub-release (zelfde artifact als de overige Linux-downloads).
      - name: Wait for release deb and download it
        if: inputs.reuse_release_snap != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          echo "Wachten op deb-asset van release $VERSION..."
          found=""
          for i in $(seq 1 10); do
            if gh release view "$VERSION" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '_amd64\.deb$'; then
              found=1
              echo "deb-asset gevonden"
              break
            fi
            echo "nog geen deb-asset... (poging $i/10)"
            sleep 15
          done
          if [ -z "$found" ]; then
            echo "::error::deb-asset voor $VERSION verscheen niet op tijd"
            exit 1
          fi
          gh release download "$VERSION" -p '*_amd64.deb' --clobber --dir .
          deb=$(ls *_amd64.deb | head -1)
          cp "$deb" open-calc-studio.deb
          echo "Gebruik $deb -> open-calc-studio.deb"

      - name: Set version in snapcraft.yaml
        if: inputs.reuse_release_snap != true
        env:
          VERSION_NUMBER: ${{ steps.get-version.outputs.version_number }}
        run: |
          sed -i "s/^version: .*/version: '$VERSION_NUMBER'/" snap/snapcraft.yaml
          grep '^version:' snap/snapcraft.yaml

      # Dedicated, disposable Ubuntu 22.04 runner matches core22. Avoid a second
      # LXD image download: two release attempts stalled before any packaging.
      # Ook in de herstelroute nodig: `snapcraft whoami` en `upload-metadata`.
      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build snap from the published DEB on the matching runner
        if: inputs.reuse_release_snap != true
        id: snapcraft
        timeout-minutes: 20
        shell: bash
        run: |
          . /etc/os-release
          test "$ID" = ubuntu && test "$VERSION_ID" = 22.04
          test "$(sed -n 's/^base: //p' snap/snapcraft.yaml)" = core22
          # This mode installs build dependencies on the disposable CI runner.
          # Never use it as the default command on a developer's workstation.
          sudo env SNAPCRAFT_BUILD_INFO=1 snapcraft pack --destructive-mode
          shopt -s nullglob
          task_snap_files=(./*.snap)
          test "${#task_snap_files[@]}" = 1
          echo "snap=${task_snap_files[0]#./}" >> "$GITHUB_OUTPUT"

      # Herstelroute (#109): precies de bytes die al op de release staan.
      # Drie onafhankelijke controles vóór er iets naar de Store gaat:
      # 1. de .sha256 van de release klopt (sha256sum -c);
      # 2. de digest die GitHub zelf voor het asset bijhoudt klopt;
      # 3. naam en versie in meta/snap.yaml horen bij deze release.
      - name: Download and verify the existing release snap
        if: inputs.reuse_release_snap == true
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get-version.outputs.version }}
          VERSION_NUMBER: ${{ steps.get-version.outputs.version_number }}
        run: |
          set -euo pipefail
          name="open-calc-studio_${VERSION_NUMBER}_amd64.snap"
          dir=release-snap
          mkdir -p "$dir"
          gh release download "$VERSION" -p "$name" -p "$name.sha256" --dir "$dir"
          if [ ! -f "$dir/$name" ] || [ ! -f "$dir/$name.sha256" ]; then
            echo "::error::Release $VERSION mist $name en/of $name.sha256; herstel met deze route kan niet."
            exit 1
          fi

          # 1. Checksumbestand: precies één regel, voor precies dit bestand.
          if [ "$(wc -l < "$dir/$name.sha256")" != 1 ] ||
             [ "$(awk '{print $2}' "$dir/$name.sha256")" != "$name" ]; then
            echo "::error::$name.sha256 heeft niet de verwachte vorm:"
            cat "$dir/$name.sha256"
            exit 1
          fi
          (cd "$dir" && sha256sum -c "$name.sha256")
          actual="sha256:$(sha256sum "$dir/$name" | cut -d' ' -f1)"

          # 2. GitHub-digest van het asset (onafhankelijk van het .sha256-bestand).
          recorded=$(SNAP_NAME="$name" gh release view "$VERSION" --json assets \
            --jq '.assets[] | select(.name == $ENV.SNAP_NAME) | .digest // ""')
          if [ -z "$recorded" ]; then
            echo "::warning::GitHub geeft geen digest voor $name; alleen de .sha256 is gecontroleerd."
          elif [ "$recorded" != "$actual" ]; then
            echo "::error::Digest wijkt af: GitHub $recorded, download $actual"
            exit 1
          fi

          # 3. Inhoud: de snap zelf moet deze naam en versie dragen.
          meta=$(unsquashfs -cat "$dir/$name" meta/snap.yaml)
          if ! printf '%s\n' "$meta" | grep -Fxq 'name: open-calc-studio' ||
             ! printf '%s\n' "$meta" | grep -Fxq \
                 -e "version: $VERSION_NUMBER" \
                 -e "version: '$VERSION_NUMBER'" \
                 -e "version: \"$VERSION_NUMBER\""; then
            echo "::error::meta/snap.yaml in $name hoort niet bij open-calc-studio $VERSION_NUMBER:"
            printf '%s\n' "$meta" | grep -E '^(name|version):' || true
            exit 1
          fi

          echo "Geverifieerd: $name ($actual)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "snap=$dir/$name" >> "$GITHUB_OUTPUT"

      # Eén pad voor de rest van de job, ongeacht welke route de snap leverde.
      - name: Select snap for upload and publication
        id: snap
        env:
          EXISTING: ${{ steps.existing.outputs.snap }}
          BUILT: ${{ steps.snapcraft.outputs.snap }}
        run: |
          path="${EXISTING:-$BUILT}"
          test -n "$path" && test -f "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # Gepubliceerde release: snap als asset aan de release hangen, met een
      # eigen checksum. SHA256SUMS.txt is al gemaakt vóór de snap bestond (#66);
      # dat bestand achteraf aanvullen kan botsen met latest-json.yml, dat op
      # hetzelfde moment draait. Controle: sha256sum -c <snap>.sha256
      # Bewust ZONDER --clobber (#109): een gepubliceerd asset wordt nooit
      # vervangen; bestaat het al, dan faalt de upload.
      - name: Upload snap to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get-version.outputs.version }}
          SNAP: ${{ steps.snap.outputs.path }}
        run: |
          name=$(basename "$SNAP")
          (cd "$(dirname "$SNAP")" && sha256sum "$name" > "$name.sha256")
          cat "$SNAP.sha256"
          gh release upload "$VERSION" "$SNAP" "$SNAP.sha256"

      # Handmatige test: snap als CI-artifact (de release NIET aanraken).
      # In de herstelroute overbodig: het bestand staat al op de release.
      - name: Upload snap as workflow artifact
        if: github.event_name == 'workflow_dispatch' && inputs.reuse_release_snap != true
        uses: actions/upload-artifact@v4
        with:
          name: open-calc-studio-snap
          path: ${{ steps.snap.outputs.path }}
          if-no-files-found: error

      # Ook de handmatige backfill mag alleen een gepubliceerde, niet-pre-release
      # naar `stable` sturen (zelfde controle als latest-json.yml).
      - name: Only a published release goes to stable
        if: >-
          env.SNAPCRAFT_STORE_CREDENTIALS != '' &&
          (github.event_name == 'release' ||
           (github.event_name == 'workflow_dispatch' && inputs.publish))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          state=$(gh release view "$VERSION" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')
          [ "$state" = "false false" ] || { echo "::error::$VERSION is een concept of pre-release"; exit 1; }

      # Credentials vóór de onomkeerbare stap controleren (#109): een duidelijke
      # foutmelding met herstelroute, en een waarschuwing ruim vóór ze verlopen.
      # Een expliciete handmatige publish zonder secret is een fout, geen stille
      # skip. `whoami` toont ook het e-mailadres van de publisher: dat NIET in
      # het (openbare) log zetten, alleen de regels hieronder.
      - name: Check Snap Store credentials
        if: >-
          (github.event_name == 'release' && env.SNAPCRAFT_STORE_CREDENTIALS != '') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::error::publish staat aan, maar het secret SNAPCRAFT_STORE_CREDENTIALS ontbreekt."
            exit 1
          fi
          if ! out=$(snapcraft whoami 2>&1); then
            printf '%s\n' "$out" | grep -v '@' || true
            echo "::error::Snap Store-credentials zijn ongeldig of verlopen. Een publisher van open-calc-studio moet ze vernieuwen (snapcraft export-login) en het secret bijwerken; publiceer daarna de snap die al op release $VERSION staat met reuse_release_snap. Zie docs/desktop-builds.md."
            exit 1
          fi
          printf '%s\n' "$out" | grep -E '^(permissions|channels|packages|snaps|expires):' || true
          expires=$(printf '%s\n' "$out" | sed -n 's/^expires: *//p' | head -1)
          if [ -z "$expires" ] || ! exp_s=$(date -u -d "$expires" +%s 2>/dev/null); then
            echo "::warning::Kon de vervaldatum van de Snap Store-credentials niet lezen."
          else
            days=$(( (exp_s - $(date -u +%s)) / 86400 ))
            echo "Credentials verlopen over $days dagen ($expires)."
            if [ "$days" -lt 45 ]; then
              echo "::warning::Snap Store-credentials verlopen over $days dagen ($expires). Vernieuw ze vóór de volgende release (docs/desktop-builds.md)."
            fi
          fi

      # Live publiceren naar de Snap Store: alleen op een gepubliceerde release
      # én pas zodra het store-credentials-secret bestaat (eigenaar-stap).
      - name: Publish to Snap Store
        if: >-
          env.SNAPCRAFT_STORE_CREDENTIALS != '' &&
          (github.event_name == 'release' ||
           (github.event_name == 'workflow_dispatch' && inputs.publish))
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.snap.outputs.path }}
          release: stable

      # Uploading a revision does not replace a manually edited Store listing.
      # Keep the listing (including its license) aligned with the released recipe.
      - name: Synchronize public Store metadata
        if: >-
          env.SNAPCRAFT_STORE_CREDENTIALS != '' &&
          (github.event_name == 'release' ||
           (github.event_name == 'workflow_dispatch' && inputs.publish))
        env:
          SNAP: ${{ steps.snap.outputs.path }}
        run: snapcraft upload-metadata "$SNAP" --force

      - name: Record public Store license
        if: >-
          env.SNAPCRAFT_STORE_CREDENTIALS != '' &&
          (github.event_name == 'release' ||
           (github.event_name == 'workflow_dispatch' && inputs.publish))
        run: |
          python3 scripts/ci/check-snap-license.py > snap-store-evidence.json
          cat snap-store-evidence.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-calc-studio-snap-store-evidence
          path: snap-store-evidence.json
          if-no-files-found: ignore
