# Kopieer dit bestand naar .github/workflows/latest-json.yml van de app.
# Het maakt de latest.json zodra een release gepubliceerd wordt (ook een concept
# dat je met de hand publiceert), en met de hand voor een bestaande tag, als
# noodknop. Let op: een release die een workflow met GITHUB_TOKEN publiceert,
# start deze workflow niet; zet dan workflow-voorbeeld.yml als laatste job erbij.
name: latest.json voor de OpenAEC Installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Bestaande tag, zoals v2026.44.1
        required: true

permissions:
  contents: write

jobs:
  updater-manifest:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      VERSION_FILE: src-tauri/tauri.conf.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/checkout@v4
        with:
          repository: OpenAEC-Foundation/openaec-installer
          ref: main
          path: .release-kit
          sparse-checkout: release-kit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Alleen een gepubliceerde release
        run: |
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')
          [ "$state" = "false false" ] || { echo "::error::$TAG is een concept of pre-release"; exit 1; }
      - run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*-setup.exe' --pattern '*-setup.exe.sig' --pattern '*.msi' --pattern '*.msi.sig' \
            --pattern '*.AppImage' --pattern '*.AppImage.sig' --pattern '*.app.tar.gz' --pattern '*.app.tar.gz.sig'
          node .release-kit/release-kit/latest-json.mjs --repo "$GITHUB_REPOSITORY" --tag "$TAG" --dir dist \
            --pubkey "${{ vars.UPDATER_PUBKEY }}" --version-file "$VERSION_FILE" --out latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
